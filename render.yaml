services:
  - type: web
    name: pacta-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_SYNC
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "480"
      - key: TRANSFEREGOV_BASE_URL
        value: http://repositorio.dados.gov.br/seges/detru/
      - key: SIGCON_DATASET_URL
        value: https://dados.mg.gov.br/dataset/convenios-saida
      - key: FRONTEND_URL
        sync: false
