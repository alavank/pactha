<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>PACTA Captura</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    width: 360px;
    margin: 0;
    padding: 0;
    color: #1a202c;
  }
  .header {
    background: linear-gradient(135deg, #1f4e79, #2563eb);
    color: white;
    padding: 14px 16px;
  }
  .header h1 {
    margin: 0;
    font-size: 14px;
    font-weight: 600;
  }
  .header .sub {
    font-size: 11px;
    opacity: 0.9;
    margin-top: 2px;
  }
  .body {
    padding: 14px 16px;
  }
  .row {
    margin-bottom: 12px;
  }
  label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: #4a5568;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  select, input {
    width: 100%;
    padding: 7px 10px;
    border: 1px solid #cbd5e0;
    border-radius: 4px;
    font-size: 13px;
    box-sizing: border-box;
  }
  button {
    width: 100%;
    padding: 9px;
    background: #1f4e79;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #163a5c; }
  button:disabled { background: #a0aec0; cursor: not-allowed; }
  button.secondary {
    background: white;
    color: #4a5568;
    border: 1px solid #cbd5e0;
    margin-top: 6px;
  }
  .domain-info {
    font-size: 11px;
    color: #718096;
    background: #f7fafc;
    padding: 6px 8px;
    border-radius: 3px;
    margin-bottom: 10px;
  }
  .status {
    margin-top: 10px;
    padding: 8px 10px;
    border-radius: 4px;
    font-size: 12px;
    display: none;
  }
  .status.success { background: #c6f6d5; color: #22543d; display: block; }
  .status.error { background: #fed7d7; color: #742a2a; display: block; }
  .status.info { background: #bee3f8; color: #2c5282; display: block; }
  .config-link {
    text-align: center;
    margin-top: 12px;
    font-size: 11px;
  }
  .config-link a {
    color: #2563eb;
    text-decoration: none;
    cursor: pointer;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="header">
    <h1>📎 PACTA - Captura de Sessao</h1>
    <div class="sub">Envia cookies seguros para automacao</div>
  </div>

  <div class="body" id="main">
    <div class="domain-info" id="domain-info">Carregando dominio atual...</div>

    <div class="row">
      <label>Sistema (automation_key)</label>
      <select id="automation-key">
        <option value="govbr">gov.br SSO</option>
        <option value="fns">FNS - Saude</option>
        <option value="simec">SIMEC/PAR - Educacao</option>
        <option value="sismob">SISMOB - Obras Saude</option>
        <option value="suas">Estrutura SUAS</option>
        <option value="investsus">InvestSUS</option>
      </select>
    </div>

    <div class="row">
      <label>Municipio ID (do PACTA)</label>
      <input type="number" id="municipio-id" placeholder="Ex: 6 = Piracema" value="6">
    </div>

    <button id="btn-capture">Capturar e enviar para PACTA</button>
    <button id="btn-config" class="secondary">Configurar token PACTA</button>

    <div class="status" id="status"></div>

    <div class="config-link">
      <a id="open-pacta">Abrir PACTA</a>
    </div>
  </div>

  <div class="body hidden" id="config">
    <div class="row">
      <label>API URL</label>
      <input type="text" id="cfg-api-url" placeholder="https://pacta-api-...railway.app/api">
    </div>
    <div class="row">
      <label>JWT Token (de admin@pacta)</label>
      <input type="password" id="cfg-token" placeholder="eyJhbGciOiJI...">
    </div>
    <button id="btn-save-config">Salvar configuracao</button>
    <button id="btn-cancel-config" class="secondary">Cancelar</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
