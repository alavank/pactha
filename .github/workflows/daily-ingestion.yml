name: Daily Data Ingestion

on:
  schedule:
    # Roda diariamente as 12:00 UTC (09:00 BRT) - apos TransfereGov publicar
    - cron: '0 12 * * *'
  workflow_dispatch:

# Cancela runs antigas se uma nova for disparada (evita filas longas)
concurrency:
  group: daily-ingestion
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Retry automatico em caso de falha transiente do runner
    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # === SIGCON-MG (estadual) - critico, fonte estavel ===
      - name: SIGCON full ingestion
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_SYNC: ${{ secrets.DATABASE_URL_SYNC }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: python ingestion/run_sigcon.py
        continue-on-error: true
        timeout-minutes: 8

      # === TransfereGov (federal) ===
      - name: TransfereGov ingestion
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_SYNC: ${{ secrets.DATABASE_URL_SYNC }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: python ingestion/run_federal.py
        continue-on-error: true
        timeout-minutes: 6

      # === TSE - so executa em workflow manual (dados de 2022 nao mudam) ===
      - name: TSE ingestion (sob demanda)
        if: github.event_name == 'workflow_dispatch'
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_SYNC: ${{ secrets.DATABASE_URL_SYNC }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: python ingestion/tse.py
        continue-on-error: true
        timeout-minutes: 8

      # === Emendas Federais (SICONV) ===
      - name: Emendas Federais ingestion
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_SYNC: ${{ secrets.DATABASE_URL_SYNC }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: python ingestion/emendas_federais.py
        continue-on-error: true
        timeout-minutes: 5

      # === Emendas Estaduais (extraidas do SIGCON) ===
      - name: Emendas Estaduais extraction
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_SYNC: ${{ secrets.DATABASE_URL_SYNC }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: python ingestion/emendas_estaduais.py
        continue-on-error: true
        timeout-minutes: 3

      # === Editais PNCP ===
      - name: Editais PNCP ingestion
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_SYNC: ${{ secrets.DATABASE_URL_SYNC }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: python ingestion/editais.py
        continue-on-error: true
        timeout-minutes: 5

      # === Portal da Transparencia (CGU) - convenios federais detalhados ===
      - name: Portal da Transparencia ingestion
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_SYNC: ${{ secrets.DATABASE_URL_SYNC }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PORTAL_TRANSPARENCIA_KEY: ${{ secrets.PORTAL_TRANSPARENCIA_KEY }}
        run: python ingestion/portal_transparencia.py
        continue-on-error: true
        timeout-minutes: 10

      # === Deduplicar parlamentares ===
      - name: Deduplicate parlamentares
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_SYNC: ${{ secrets.DATABASE_URL_SYNC }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: python ingestion/dedupe_parlamentares.py
        continue-on-error: true
        timeout-minutes: 2
