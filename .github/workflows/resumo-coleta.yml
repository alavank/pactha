# Resumo diario da coleta de TODOS os tenants, numa mensagem so no Telegram.
#
# ⭐ POR QUE AQUI E NAO NUMA SCHEDULED TASK DO COOLIFY
#
# Porque quem esta morto nao manda mensagem. O watchdog que roda dentro do worker
# nao consegue relatar a propria morte: se o container cair ou a task nao
# disparar, ele nao roda, nao alerta, e o silencio fica identico a saude — foi
# essa a forma dos 6 dias de regularidade estadual parada (CONTINUAR.md §1.18).
# O runner do GitHub e a unica coisa que este projeto ja usa e que nao mora na
# mesma VPS: se a VPS inteira cair, este job continua rodando e diz isso.
#
# ⚠️ O cron do GitHub Actions ATRASA (5 a 30 min, as vezes mais em horario de
# pico). Isso e aceitavel para um resumo diario e seria inaceitavel para alarme
# urgente — quem grita na hora continua sendo o Telegram do worker, a cada 30 min.
# Nao troque um pelo outro: eles cobrem falhas diferentes.
#
# ⚠️ A LISTA DE TENANTS MORA NUM SECRET, E SECRET NAO ACOMPANHA MERGE. O bgk (6o)
# entrou na `main` no dia seguinte a escrita deste arquivo, que ja nascia dizendo
# "os cinco". Tenant novo so aparece no resumo quando alguem reeditar o secret —
# por isso o job compara a lista do secret com os trios TENANTS do
# `build-backend.yml` e avisa quem esta deployado e fora do relatorio.
#
# Segredos exigidos no repo:
#   PACTHA_RESUMO_TENANTS   JSON, um item por tenant deployado:
#                           [{"slug","api_url","control_token"}]
#                           control_token = valor de CONTROL_TOKEN_BOOTSTRAP da
#                           API daquele tenant (ja existe em todos).
#   RESUMO_TELEGRAM_TOKEN   token do bot (o mesmo pactha_watchdog_bot serve)
#   RESUMO_TELEGRAM_CHAT_ID destino
name: resumo-coleta

on:
  schedule:
    # 10:00 UTC = 07:00 BRT. ⚠️ O runner NAO segue horario de verao brasileiro
    # (que hoje nao existe); se voltar a existir, esta linha vira 09:00 UTC.
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      janela_horas:
        description: "Janela em horas (default 24)"
        required: false
        default: "24"
      dry_run:
        description: "1 = so imprime no log, nao envia no Telegram"
        required: false
        default: "0"

# ⚠️ `permissions: {}` MATA O CHECKOUT NUM REPO PRIVADO — medido em 09/09/2026.
# Zerar o escopo tira do GITHUB_TOKEN ate o `contents: read`, e o
# actions/checkout usa esse token para clonar: o run 34352914795 morreu no passo
# 2 com «repository 'https://github.com/alavank/pactha/' not found», sem chegar
# a rodar o script. Num repo publico o mesmo arquivo funcionaria — por isso o
# desenho passou batido. `contents: read` e o minimo que ainda serve: nada de
# escrever, nada de packages, nada de id-token.
permissions:
  contents: read

jobs:
  resumo:
    # RUNNER PROPRIO NA VPS (18/09/2026) — ver build-frontend.yml.
    # ⚠️ ESTE roda de madrugada, DENTRO da janela de coleta: e leve de proposito
    # (stdlib pura, sem pip install), entao nao disputa a maquina com o rodizio.
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Sem `pip install`: o script e stdlib pura, de proposito. A unica coisa
      # pior que um vigia mudo e um vigia que quebra resolvendo dependencia.
      - name: Enviar resumo
        env:
          PACTHA_RESUMO_TENANTS: ${{ secrets.PACTHA_RESUMO_TENANTS }}
          RESUMO_TELEGRAM_TOKEN: ${{ secrets.RESUMO_TELEGRAM_TOKEN }}
          RESUMO_TELEGRAM_CHAT_ID: ${{ secrets.RESUMO_TELEGRAM_CHAT_ID }}
          RESUMO_JANELA_HORAS: ${{ inputs.janela_horas || '24' }}
          RESUMO_DRY_RUN: ${{ inputs.dry_run || '0' }}
        run: python scripts/resumo_coleta.py

      # ⭐ QUEM AVISA QUE O AVISADOR NAO RODOU.
      #
      # O defeito do `permissions: {}` mostrou o buraco: o job morria ANTES do
      # script, entao nao havia mensagem nenhuma — e ausencia de mensagem e
      # exatamente o que este vigia existe para nao deixar acontecer. Vermelho na
      # aba Actions so avisa quem for olhar a aba Actions.
      #
      # Este passo nao usa o script (que pode ser justamente o que quebrou): e
      # curl puro, no mesmo canal. Se nem o secret do Telegram existir, ele sai
      # calado — nao ha para onde gritar.
      - name: Avisar que o proprio resumo falhou
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.RESUMO_TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.RESUMO_TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ] || exit 0
          TEXTO="🔴 PACTHA — o resumo diario da coleta NAO rodou hoje: o job falhou antes de enviar. Nao ha noticia da coleta, nem boa nem ma. Log: $RUN_URL"
          # `--data-urlencode` monta o corpo sem shell-quoting a mao: o texto tem
          # acento, emoji e URL, e um JSON montado com echo quebraria no primeiro
          # caractere estranho. Saida descartada: a resposta repete o token.
          curl -sS -m 20 -o /dev/null \
            "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TG_CHAT" \
            --data-urlencode "text=$TEXTO" \
            --data "disable_web_page_preview=true" || true
