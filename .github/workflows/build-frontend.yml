name: build-frontend

# Builda as imagens dos FRONTENDS no GitHub Actions em vez de na VPS.
#
# Diferente do backend (uma imagem para os 3 tenants), cada frontend e
# GENUINAMENTE diferente: os build-args NEXT_PUBLIC_* e API_PROXY_TARGET sao
# INLINED no bundle Next em build-time (o proprio Dockerfile documenta isso).
# Entao cada tenant precisa da sua propria imagem, com os args embutidos --
# por isso a matriz abaixo.
#
# Os valores nao sao segredos: sao caminhos de logo, textos de subtitulo e URLs
# publicas de API. Ficam aqui, versionados, de proposito (auto-documentado).
#
# TRADE-OFF consciente: com a config do tenant embutida na imagem, trocar um
# logo/subtitulo/URL de um cliente passa a exigir editar este arquivo + rebuild
# do CI (antes era so mudar a env no Coolify e redeployar). Em troca, a VPS
# deixa de buildar Next.js. Para onboarding de cliente novo, adicionar uma
# entrada na matriz.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-frontend.yml'
  workflow_dispatch: {}

# Concurrency no JOB de build (nao no workflow) — mesmo motivo do backend:
# cancel no nivel do workflow matava deploy em pleno voo no segundo push.
# SKEW ACEITO: merge que toca backend+frontend deploya os dois por workflows
# independentes, sem ordem garantida entre eles (janela de minutos de UI nova
# com API velha ou vice-versa). Releases sao retrocompativeis por disciplina;
# se um dia um contrato quebrar de verdade, acoplar via workflow_run.
env:
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/pactha

jobs:
  build:
    concurrency:
      group: build-frontend-${{ github.ref }}-${{ matrix.image }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- frontends dos tenants (contexto frontend/) ---
          - image: frontend-freitas
            context: frontend
            args: |
              NEXT_PUBLIC_API_URL=/api
              API_PROXY_TARGET=https://pactha-api-54-232-208-118.sslip.io
              NEXT_PUBLIC_CLIENT_LOGO=/freitas-logo.jpeg
              NEXT_PUBLIC_CLIENT_SUBTITLE=Assessoria
              NEXT_PUBLIC_BI_MODULE=1
          - image: frontend-trust
            context: frontend
            args: |
              NEXT_PUBLIC_API_URL=/api
              API_PROXY_TARGET=https://pactha-trust-api-54-232-208-118.sslip.io
              NEXT_PUBLIC_CLIENT_LOGO=/trust-logo.png
              NEXT_PUBLIC_CLIENT_SUBTITLE=Infraestrutura de TI e Cloud Computing
              NEXT_PUBLIC_BI_MODULE=1
          - image: frontend-montesiao-mg
            context: frontend
            args: |
              NEXT_PUBLIC_API_URL=/api
              API_PROXY_TARGET=https://pactha-montesiao-mg-api-54-232-208-118.sslip.io
              NEXT_PUBLIC_CLIENT_LOGO=/brasao-monte-siao.png
              NEXT_PUBLIC_CLIENT_SUBTITLE=Monte Siao - MG
              NEXT_PUBLIC_BI_MODULE=1
          # O antigo "painel executivo" (pasta painel/, imagem painel-montesiao-mg)
          # SAIU da matriz: o Painel de Indicadores e o Modo Tela agora moram no
          # proprio frontend (rotas /dashboard e /tela), no mesmo deploy e no
          # mesmo login. Manter um segundo app so para a TV era um build a mais
          # por push numa VPS burstable, sem nada em troca.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          build-args: ${{ matrix.args }}
          tags: |
            ${{ env.IMAGE_BASE }}-${{ matrix.image }}:latest
            ${{ env.IMAGE_BASE }}-${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_BASE }}-${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_BASE }}-${{ matrix.image }}:buildcache,mode=max

      - name: Resumo
        run: echo "Publicado ${{ env.IMAGE_BASE }}-${{ matrix.image }}:latest" >> "$GITHUB_STEP_SUMMARY"

  # Fase D (09/08/2026): o CI fecha o ciclo tambem nos frontends — avanca a tag
  # (sha COMPLETO, padrao deste workflow) e deploya os 3 apps, confirmando cada
  # deployment via GET /deployments/{uuid}. Sem gate de janela: frontend nao
  # roda coleta, um restart de segundos nao machuca. Auto-deploy por webhook do
  # Coolify DESLIGADO nos apps pactha (recriava com tag antiga e ja matou
  # coleta). Segredos: COOLIFY_URL + COOLIFY_TOKEN (sem eles, falha alta).
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 75   # fila do Coolify pode custar ~20min/app
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
    steps:
      - name: Avanca tag e deploya os 3 frontends
        run: |
          # Mesma politica de erro do backend: -e do Actions desligado, mutacao
          # falha alto com rollback de tag, leitura falha fechado.
          set +e
          set -uo pipefail
          TAG="sha-${GITHUB_SHA}"
          CURL=(curl -sS --connect-timeout 10 --max-time 30 -H "Authorization: Bearer $COOLIFY_TOKEN")
          FALHAS=""
          # mapa app->uuid no Coolify (ver PROVISIONAR_CLIENTE.md p/ tenant novo)
          for APP in qgmw4e5wjem1e8jit2wyvo1d j5ghp71lff003d5rfaynvy5y bryvqhhcu97lc3ku7a2hss0q; do
            OLD_TAG=$("${CURL[@]}" "$COOLIFY_URL/api/v1/applications/$APP" | jq -r '.docker_registry_image_tag // ""')
            if ! "${CURL[@]}" -X PATCH -H "Content-Type: application/json" \
                 -d "{\"docker_registry_image_tag\":\"$TAG\"}" \
                 "$COOLIFY_URL/api/v1/applications/$APP" > /dev/null; then
              echo "::error::frontend $APP: PATCH da tag falhou — app intocado"
              FALHAS="$FALHAS $APP"; continue
            fi
            DEP=$("${CURL[@]}" --retry 3 --retry-all-errors "$COOLIFY_URL/api/v1/deploy?uuid=$APP" \
                  | jq -r '.deployments[0].deployment_uuid // ""')
            if [ -z "$DEP" ]; then
              echo "::error::frontend $APP: deploy nao disparou — revertendo tag p/ '${OLD_TAG:-?}'"
              [ -n "$OLD_TAG" ] && "${CURL[@]}" -X PATCH -H "Content-Type: application/json" \
                -d "{\"docker_registry_image_tag\":\"$OLD_TAG\"}" \
                "$COOLIFY_URL/api/v1/applications/$APP" > /dev/null
              FALHAS="$FALHAS $APP"; continue
            fi
            ok=""
            # fila 20min + execucao 10min (concurrent_builds=1 no server; builds
            # de outros projetos na VPS seguram o slot — ver build-backend.yml)
            fila=120; execucao=60
            while :; do
              st=$("${CURL[@]}" "$COOLIFY_URL/api/v1/deployments/$DEP" | jq -r '.status // ""' 2>/dev/null)
              case "$st" in
                finished) ok=1; break ;;
                failed|cancelled*) echo "::error::frontend $APP: deployment '$st'"; break ;;
                queued) fila=$((fila-1)); if [ "$fila" -le 0 ]; then break; fi ;;
                *) execucao=$((execucao-1)); if [ "$execucao" -le 0 ]; then break; fi ;;
              esac
              sleep 10
            done
            if [ -n "$ok" ]; then echo "frontend $APP -> $TAG (confirmado)"; else FALHAS="$FALHAS $APP"; fi
          done
          {
            echo "### Deploy frontend: $TAG"
            [ -n "$FALHAS" ] && echo "FALHARAM:$FALHAS — conferir no Coolify." || echo "3 frontends confirmados."
          } >> "$GITHUB_STEP_SUMMARY"
          [ -z "$FALHAS" ]
