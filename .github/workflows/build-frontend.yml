name: build-frontend

# Builda as imagens dos FRONTENDS no GitHub Actions em vez de na VPS.
#
# Diferente do backend (uma imagem para os 4 tenants), cada frontend e
# GENUINAMENTE diferente: os build-args NEXT_PUBLIC_* e API_PROXY_TARGET sao
# INLINED no bundle Next em build-time (o proprio Dockerfile documenta isso).
# Entao cada tenant precisa da sua propria imagem, com os args embutidos --
# por isso a matriz abaixo.
#
# Os valores nao sao segredos: sao caminhos de logo, textos de subtitulo e URLs
# publicas de API. Ficam aqui, versionados, de proposito (auto-documentado).
#
# TRADE-OFF consciente: com a config do tenant embutida na imagem, trocar um
# logo/subtitulo/URL de um cliente passa a exigir editar este arquivo + rebuild
# do CI (antes era so mudar a env no Coolify e redeployar). Em troca, a VPS
# deixa de buildar Next.js. Para onboarding de cliente novo, adicionar uma
# entrada na matriz.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-frontend.yml'
  workflow_dispatch: {}

# Concurrency no JOB de build (nao no workflow) — mesmo motivo do backend:
# cancel no nivel do workflow matava deploy em pleno voo no segundo push.
# SKEW ACEITO: merge que toca backend+frontend deploya os dois por workflows
# independentes, sem ordem garantida entre eles (janela de minutos de UI nova
# com API velha ou vice-versa). Releases sao retrocompativeis por disciplina;
# se um dia um contrato quebrar de verdade, acoplar via workflow_run.
env:
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/pactha

jobs:
  build:
    concurrency:
      group: build-frontend-${{ github.ref }}-${{ matrix.image }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- frontends dos tenants (contexto frontend/) ---
          - image: frontend-freitas
            context: frontend
            args: |
              NEXT_PUBLIC_API_URL=/api
              API_PROXY_TARGET=https://pactha-api-54-232-208-118.sslip.io
              NEXT_PUBLIC_CLIENT_LOGO=/logo-freitas.png
              NEXT_PUBLIC_CLIENT_SUBTITLE=Assessoria
              NEXT_PUBLIC_BI_MODULE=1
              NEXT_PUBLIC_CLIENT_NAME=Freitas & Associados
              NEXT_PUBLIC_SITE_URL=https://freitas.pactha.com.br
          - image: frontend-trust
            context: frontend
            args: |
              NEXT_PUBLIC_API_URL=/api
              API_PROXY_TARGET=https://pactha-trust-api-54-232-208-118.sslip.io
              NEXT_PUBLIC_CLIENT_LOGO=/trust-logo.png
              NEXT_PUBLIC_CLIENT_SUBTITLE=Infraestrutura de TI e Cloud Computing
              NEXT_PUBLIC_BI_MODULE=1
              NEXT_PUBLIC_CLIENT_NAME=Trust
              NEXT_PUBLIC_SITE_URL=https://trust.pactha.com.br
          - image: frontend-montesiao-mg
            context: frontend
            args: |
              NEXT_PUBLIC_API_URL=/api
              API_PROXY_TARGET=https://pactha-montesiao-mg-api-54-232-208-118.sslip.io
              NEXT_PUBLIC_CLIENT_LOGO=/brasao-monte-siao.png
              NEXT_PUBLIC_CLIENT_SUBTITLE=Monte Siao - MG
              NEXT_PUBLIC_BI_MODULE=1
              NEXT_PUBLIC_CLIENT_NAME=Monte Sião - MG
              NEXT_PUBLIC_SITE_URL=https://montesiao.mg.pactha.com.br
          # Santa Maria/RS — 4o tenant. O dominio do APP e proprio
          # (santamaria.rs.pactha.com.br), mas o API_PROXY_TARGET aponta para o
          # sslip da API DELE: nao existe DNS api-santamaria.rs.pactha.com.br e
          # nao ha wildcard em *.rs.pactha.com.br. Mesmo arranjo do Monte Siao.
          - image: frontend-santamaria-rs
            context: frontend
            args: |
              NEXT_PUBLIC_API_URL=/api
              API_PROXY_TARGET=https://pactha-santamaria-rs-api-54-232-208-118.sslip.io
              NEXT_PUBLIC_CLIENT_LOGO=/brasao-santa-maria.png
              NEXT_PUBLIC_CLIENT_SUBTITLE=Santa Maria - RS
              NEXT_PUBLIC_BI_MODULE=1
              NEXT_PUBLIC_CLIENT_NAME=Santa Maria - RS
              NEXT_PUBLIC_SITE_URL=https://santamaria.rs.pactha.com.br
          # Nova Palma/RS — 5o tenant, aberto em 01/09/2026. Mesmo arranjo do
          # Santa Maria (RS tambem): so o sslip por enquanto, sem dominio proprio.
          #
          # O brasao chegou em 02/09/2026 e o tenant deixa de subir sem marca.
          # Origem: Wikimedia Commons, File:Brasao Nova Palma.jpg — DOMINIO
          # PUBLICO, de autoria da propria Prefeitura de Nova Palma. E o simbolo
          # oficial do municipio na plataforma do proprio municipio.
          - image: frontend-novapalma-rs
            context: frontend
            args: |
              NEXT_PUBLIC_API_URL=/api
              API_PROXY_TARGET=https://pactha-novapalma-rs-api-54-232-208-118.sslip.io
              NEXT_PUBLIC_CLIENT_LOGO=/brasao-nova-palma.png
              NEXT_PUBLIC_CLIENT_SUBTITLE=Nova Palma - RS
              NEXT_PUBLIC_BI_MODULE=1
              NEXT_PUBLIC_CLIENT_NAME=Nova Palma - RS
              NEXT_PUBLIC_SITE_URL=https://novapalma.rs.pactha.com.br
          # BGK Assessoria — 6o tenant, aberto em 08/09/2026. ASSESSORIA com 10
          # municipios do RS (Bento Goncalves, Veranopolis, Nova Prata, Guapore,
          # Serafina Correa, Sao Marcos, Carlos Barbosa, Garibaldi, Portao, Girua).
          # Dominio proprio bgk.pactha.com.br (DNS a apontar para 54.232.208.118);
          # ate propagar, so o sslip. O API_PROXY_TARGET aponta para o sslip da API
          # DELE — mesmo arranjo dos outros RS. Logo do proprio cliente.
          - image: frontend-bgk-rs
            context: frontend
            args: |
              NEXT_PUBLIC_API_URL=/api
              API_PROXY_TARGET=https://pactha-bgk-rs-api-54-232-208-118.sslip.io
              NEXT_PUBLIC_CLIENT_LOGO=/logo-bgk.png
              NEXT_PUBLIC_CLIENT_SUBTITLE=Assessoria
              NEXT_PUBLIC_BI_MODULE=1
              NEXT_PUBLIC_CLIENT_NAME=BGK Assessoria
              NEXT_PUBLIC_SITE_URL=https://bgk.pactha.com.br
          # Juranda/PR — 7o tenant, aberto em 21/09/2026. Primeiro cliente do
          # Parana: nasce so com as fontes federais (nao ha coletor estadual do PR).
          # Dominio proprio juranda.pr.pactha.com.br; o API_PROXY_TARGET aponta
          # para o sslip da API DELE — mesmo arranjo do Santa Maria e da Nova Palma.
          #
          # Brasao: Wikimedia Commons, File:Brasao de Juranda PR Brasil.png —
          # DOMINIO PUBLICO, simbolo oficial instituido por lei municipal.
          - image: frontend-juranda-pr
            context: frontend
            args: |
              NEXT_PUBLIC_API_URL=/api
              API_PROXY_TARGET=https://pactha-juranda-pr-api-54-232-208-118.sslip.io
              NEXT_PUBLIC_CLIENT_LOGO=/brasao-juranda.png
              NEXT_PUBLIC_CLIENT_SUBTITLE=Juranda - PR
              NEXT_PUBLIC_BI_MODULE=1
              NEXT_PUBLIC_CLIENT_NAME=Juranda - PR
              NEXT_PUBLIC_SITE_URL=https://juranda.pr.pactha.com.br
          # O antigo "painel executivo" (pasta painel/, imagem painel-montesiao-mg)
          # SAIU da matriz: o Painel de Indicadores e o Modo Tela agora moram no
          # proprio frontend (rotas /dashboard e /tela), no mesmo deploy e no
          # mesmo login. Manter um segundo app so para a TV era um build a mais
          # por push, sem nada em troca. (O texto daqui dizia "VPS burstable";
          # a maquina tem 8 vCPU desde o upgrade -- ver INFRA.md §1. O argumento
          # nunca dependeu disso: build inutil e build inutil em qualquer CPU.)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          build-args: ${{ matrix.args }}
          tags: |
            ${{ env.IMAGE_BASE }}-${{ matrix.image }}:latest
            ${{ env.IMAGE_BASE }}-${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_BASE }}-${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_BASE }}-${{ matrix.image }}:buildcache,mode=max

      - name: Resumo
        run: echo "Publicado ${{ env.IMAGE_BASE }}-${{ matrix.image }}:latest" >> "$GITHUB_STEP_SUMMARY"

  # Fase D (09/08/2026): o CI fecha o ciclo tambem nos frontends — avanca a tag
  # (sha COMPLETO, padrao deste workflow) e deploya os 4 apps, confirmando cada
  # deployment via GET /deployments/{uuid}. Sem gate de janela: frontend nao
  # roda coleta, um restart de segundos nao machuca. Auto-deploy por webhook do
  # Coolify DESLIGADO nos apps pactha (recriava com tag antiga e ja matou
  # coleta). Segredos: COOLIFY_URL + COOLIFY_TOKEN (sem eles, falha alta).
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Teto de seguranca. Com os seis disparados juntos (15/09/2026) o normal e a
    # duracao do mais lento, nao a soma; um timeout aqui ainda deixaria parte dos
    # tenants na tag nova e parte na velha, por isso o teto continua folgado.
    timeout-minutes: 120
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
    steps:
      - name: Avanca tag e deploya os 7 frontends
        run: |
          # Mesma politica de erro do backend: -e do Actions desligado, mutacao
          # falha alto com rollback de tag, leitura falha fechado.
          set +e
          set -uo pipefail
          TAG="sha-${GITHUB_SHA}"
          CURL=(curl -sS --connect-timeout 10 --max-time 30 -H "Authorization: Bearer $COOLIFY_TOKEN")
          FALHAS=""; INCERTOS=""

          # ⭐ CREDENCIAL PRIMEIRO — ver o comentario longo no build-backend.yml.
          # Resumo: com o token vencido, TODAS as chamadas voltam 401 e o jq so
          # devolve vazio, entao a mensagem vira "deploy nao disparou" e esconde
          # a causa. Aconteceu em 16/08/2026 e custou quatro merges sem deploy.
          HTTP_AUTH=$("${CURL[@]}" -o /dev/null -w '%{http_code}'                       "$COOLIFY_URL/api/v1/applications" || echo "000")
          case "$HTTP_AUTH" in
            200) : ;;
            401|403)
              echo "::error::COOLIFY_TOKEN invalido ou revogado (HTTP $HTTP_AUTH) — atualize o"
              echo "::error::secret COOLIFY_TOKEN do repo. NADA foi deployado."
              exit 1 ;;
            000)
              echo "::error::Coolify inacessivel a partir do Actions ($COOLIFY_URL)."
              exit 1 ;;
            *)
              echo "::error::Coolify respondeu HTTP $HTTP_AUTH — abortando antes de mexer em tag."
              exit 1 ;;
          esac
          # mapa app->uuid no Coolify (ver PROVISIONAR_CLIENTE.md p/ tenant novo)
          #
          # ⭐ OS SEIS DE UMA VEZ (15/09/2026, decisao do dono: "a maquina e boa,
          # tira essas limitacoes"). Antes cada app so era disparado depois que o
          # anterior confirmava — seis filas de ate 20 min em serie. Agora a tag
          # avanca e o deploy e disparado nos seis, e so DEPOIS o job espera a
          # confirmacao de cada um. O paralelismo real vem do `concurrent_builds`
          # do servidor no Coolify (INFRA.md §4).
          declare -A DEPS=()
          for APP in qgmw4e5wjem1e8jit2wyvo1d j5ghp71lff003d5rfaynvy5y bryvqhhcu97lc3ku7a2hss0q eohjo0cy4nbl6t7hiaqwagwf rpqpxroy5orsuidrbfezlzkt srbi2qotciphxdxhn6io25a3 4sbd4cqwudzvlqaj8ckalbrp; do
            OLD_TAG=$("${CURL[@]}" "$COOLIFY_URL/api/v1/applications/$APP" | jq -r '.docker_registry_image_tag // ""')
            if ! "${CURL[@]}" -X PATCH -H "Content-Type: application/json" \
                 -d "{\"docker_registry_image_tag\":\"$TAG\"}" \
                 "$COOLIFY_URL/api/v1/applications/$APP" > /dev/null; then
              echo "::error::frontend $APP: PATCH da tag falhou — app intocado"
              FALHAS="$FALHAS $APP"; continue
            fi
            # POST, e nao GET — o Coolify v4.3.1 mudou o verbo do disparo. O GET
            # passou a responder "isso precisa ser POST" com HTTP 200, e foi por
            # isso que a quebra passou despercebida. Ver o comentario longo no
            # build-backend.yml.
            DEP=$("${CURL[@]}" -X POST --retry 3 --retry-all-errors "$COOLIFY_URL/api/v1/deploy?uuid=$APP" \
                  | jq -r '.deployments[0].deployment_uuid // ""')
            if [ -z "$DEP" ]; then
              echo "::error::frontend $APP: deploy nao disparou — revertendo tag p/ '${OLD_TAG:-?}'"
              [ -n "$OLD_TAG" ] && "${CURL[@]}" -X PATCH -H "Content-Type: application/json" \
                -d "{\"docker_registry_image_tag\":\"$OLD_TAG\"}" \
                "$COOLIFY_URL/api/v1/applications/$APP" > /dev/null
              FALHAS="$FALHAS $APP"; continue
            fi
            DEPS[$APP]="$DEP"
            echo "frontend $APP: deployment $DEP disparado"
          done

          for APP in "${!DEPS[@]}"; do
            DEP="${DEPS[$APP]}"
            ok=""
            # fila 20min + execucao 20min (o servidor tinha concurrent_builds=1
            # ate 15/09/2026; builds de outros projetos na VPS ainda disputam
            # slot — ver build-backend.yml).
            # ⚠️ A execucao era 10min sob a premissa de que deploy de frontend e
            # "so um pull". Nao e: em 17/08 o montesiao-mg levou 12min49 e o job
            # desistiu 2min ANTES de ele terminar — deploy correto reportado como
            # falha. Com 4 tenants a premissa envelheceu; o teto acompanha.
            fila=120; execucao=120
            while :; do
              st=$("${CURL[@]}" "$COOLIFY_URL/api/v1/deployments/$DEP" | jq -r '.status // ""' 2>/dev/null)
              case "$st" in
                finished) ok=1; break ;;
                failed|cancelled*) echo "::error::frontend $APP: deployment '$st'"; break ;;
                queued) fila=$((fila-1)); if [ "$fila" -le 0 ]; then break; fi ;;
                *) execucao=$((execucao-1)); if [ "$execucao" -le 0 ]; then break; fi ;;
              esac
              sleep 10
            done
            # ⭐ ESTOURAR O RELOGIO NAO E O MESMO QUE FALHAR, e tratar os dois
            # como falha e o que ensina a ignorar o CI. Quem estourou ainda
            # 'in_progress' estava deployando e quase certamente terminou (foi o
            # caso do montesiao) — vira AVISO. Quem estourou em 'queued' nunca
            # comecou: esse e falha de verdade, o app ficou para tras.
            if [ -n "$ok" ]; then
              echo "frontend $APP -> $TAG (confirmado)"
            elif [ "$st" = "queued" ] || [ -z "$st" ]; then
              echo "::error::frontend $APP: preso em '${st:-sem resposta}' — nao deployou"
              FALHAS="$FALHAS $APP"
            else
              echo "::warning::frontend $APP: ainda '$st' apos a espera — deploy provavelmente concluiu depois; conferir a tag no Coolify"
              INCERTOS="$INCERTOS $APP"
            fi
          done
          # ⚠️ `if`, e nao `[ … ] && echo`: o shell do step roda com `-e`, e um
          # `&&` cuja condicao e falsa devolve 1 e MATA o step — o summary
          # sairia truncado num job que deu certo.
          {
            echo "### Deploy frontend: $TAG"
            if [ -n "$FALHAS" ]; then echo "FALHARAM:$FALHAS — conferir no Coolify."; fi
            if [ -n "$INCERTOS" ]; then echo "NAO CONFIRMADOS (seguiam rodando):$INCERTOS — conferir a tag no Coolify."; fi
            if [ -z "$FALHAS$INCERTOS" ]; then echo "6 frontends confirmados."; fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ -z "$FALHAS" ]
