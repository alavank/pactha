name: build-backend

# Builda UMA vez as imagens do backend compartilhadas pelos 4 tenants
# (freitas/trust/montesiao/santamaria) e publica no GitHub Container Registry (ghcr.io).
#
# POR QUE: a API e o worker sao IDENTICOS entre os 4 tenants -- a diferenca deles
# e so env de runtime. Hoje cada push na main faz a VPS (AWS Lightsail t3.large,
# 2 vCPU burstable) buildar as 6 imagens (3 api + 3 worker), sendo o worker de
# 2,4 GB com Chromium. Isso queimou os creditos de burst da instancia duas vezes
# em 23/07. Buildando aqui UMA vez, a VPS deixa de fazer esse trabalho.
#
# ESTADO ATUAL (Fase D, desde 09/08/2026): este workflow PUBLICA a imagem e o
# job `deploy` FECHA o ciclo — avanca a tag dos 8 apps no Coolify e dispara o
# deploy na ordem certa (APIs primeiro, que rodam as migrations no boot;
# workers depois, esperando janela sem coleta em voo). O auto-deploy por
# webhook do Coolify foi DESLIGADO nos apps pactha: ele recriava os containers
# com a TAG ANTIGA (churn inutil que registra commit novo rodando imagem velha
# na fila de deploy) e ja matou coleta no meio duas vezes em 08/08.
#
# Segredos exigidos no repo: COOLIFY_URL (ex.: http://54.232.208.118:8000) e
# COOLIFY_TOKEN (token de API com permissao write+deploy).
#
# Os FRONTENDS nao entram aqui: cada tenant embute build-args proprios
# (NEXT_PUBLIC_API_URL, logo, subtitulo) no bundle Next em build time, entao sao
# genuinamente diferentes -- ver build-frontend.yml (que tambem deploya).

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/build-backend.yml'
  workflow_dispatch: {}   # permite rodar manualmente pelo painel do GitHub

# Concurrency NO JOB de build (nao no workflow): com cancel no nivel do
# workflow, um segundo push na main cancelava o RUN INTEIRO — inclusive um
# deploy em pleno voo, deixando tenants em estado parcial. Assim, build
# obsoleto e cancelado, mas deploy em andamento sempre termina.
env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/pactha

jobs:
  build:
    concurrency:
      group: build-backend-${{ github.ref }}-${{ matrix.name }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # publicar no ghcr da org
    strategy:
      fail-fast: false       # se a api falhar, ainda tenta o worker (e vice-versa)
      matrix:
        include:
          - name: api
            dockerfile: backend/Dockerfile.api
          - name: worker
            dockerfile: backend/Dockerfile.scraper
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # token efemero do proprio run

      # Tags: sha curto (imutavel, para pin exato) + latest (o que os apps seguem).
      - name: Metadados / tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .                       # contexto = RAIZ (os Dockerfiles fazem COPY backend/)
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache de layers no proprio ghcr: builds seguintes reaproveitam o
          # Chromium/pip e ficam MUITO mais rapidos (o custo do worker esta nessas
          # camadas, nao no codigo).
          cache-from: type=registry,ref=${{ env.IMAGE_BASE }}-${{ matrix.name }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_BASE }}-${{ matrix.name }}:buildcache,mode=max

      - name: Resumo
        run: |
          echo "### Imagem publicada: ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # Fase D: avanca a tag no Coolify e deploya, PAREADO POR TENANT: a API sobe
  # primeiro (roda as migrations no boot) e o deployment dela e CONFIRMADO via
  # GET /deployments/{uuid} (poll no status do app seria placebo: o container
  # velho segue 'running:healthy' enquanto o novo nem puxou imagem). So entao o
  # worker do MESMO tenant e deployado, esperando janela sem coleta em voo —
  # API que nao subiu = worker daquele tenant NAO e tocado (evita worker novo
  # contra schema velho). Segredos exigidos: COOLIFY_URL e COOLIFY_TOKEN
  # (sem eles o job falha alto no primeiro curl — nunca em silencio).
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120   # fila do Coolify (concurrent_builds=1) pode custar ~20min/tenant (4 tenants desde 08/2026)
    concurrency:
      group: deploy-backend        # serializa deploys; um novo ESPERA o atual
      cancel-in-progress: false
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      # trios nome:api_uuid:worker_uuid (instancia Coolify; PROVISIONAR_CLIENTE.md)
      TENANTS: >-
        freitas:givx3567ygxppum10p1oungn:s49c3b58lysqq0tpelneg3g3
        trust:pphvk2ygkuirjhu9qptvmfs5:xg714h8l7va4ejq70a5pmv5t
        montesiao:chr0n883hp19tjh7829k85a7:jhf0kjhps5keujiyhhsnvjt6
        santamaria:ufjctldngc14dsdw8pxnqivl:wquremniv57gag3tlil8uf6d
    steps:
      - name: Deploy por tenant (API -> migrations confirmadas -> worker com janela)
        run: |
          # POLITICA DE ERRO EXPLICITA. O shell default do Actions e `bash -e {0}`,
          # entao desligamos o -e e tratamos CADA comando: mutacao (PATCH/deploy)
          # falha ALTO com rollback de tag; leitura (polls) falha FECHADO
          # (erro de curl/jq conta como "ocupado"/"nao confirmado", nunca como ok).
          set +e
          set -uo pipefail
          TAG="sha-${GITHUB_SHA::7}"
          CURL=(curl -sS --connect-timeout 10 --max-time 30 -H "Authorization: Bearer $COOLIFY_TOKEN")
          # Denylist das tasks sabidamente CURTAS (<30s, toleram restart). Task
          # nova/desconhecida cai automaticamente no lado PROTEGIDO do gate.
          CURTAS='^(watchdog|private-keepalive|queue-sigcon|govbr-renew|painel-alertas)$'
          FALHAS=""

          patch_tag() {  # $1 uuid; usa $TAG; exporta OLD_TAG p/ rollback
            OLD_TAG=$("${CURL[@]}" "$COOLIFY_URL/api/v1/applications/$1" | jq -r '.docker_registry_image_tag // ""')
            "${CURL[@]}" -X PATCH -H "Content-Type: application/json" \
              -d "{\"docker_registry_image_tag\":\"$TAG\"}" \
              "$COOLIFY_URL/api/v1/applications/$1" > /dev/null
          }
          rollback_tag() {  # $1 uuid; usa $OLD_TAG
            [ -n "$OLD_TAG" ] && "${CURL[@]}" -X PATCH -H "Content-Type: application/json" \
              -d "{\"docker_registry_image_tag\":\"$OLD_TAG\"}" \
              "$COOLIFY_URL/api/v1/applications/$1" > /dev/null
          }
          disparar_deploy() {  # $1 uuid -> stdout: deployment_uuid (vazio = falhou)
            # POST, e nao GET. O Coolify se atualizou sozinho para a v4.3.1 e o
            # disparo de deploy virou POST. O GET NAO sumiu — passou a responder
            # um aviso "isso precisa ser POST", com HTTP 200:
            #     Route::get ('/deploy', [OtherController::class, 'post_required'])
            #     Route::post('/deploy', [DeployController::class, 'deploy'])
            # Por isso a quebra foi SILENCIOSA: 200 com o corpo errado, o jq nao
            # achou `.deployments[0].deployment_uuid`, devolveu vazio, e o CI
            # concluiu (corretamente) "deploy nao disparou" e reverteu a tag nos
            # tres tenants. Um 404 teria feito o --retry-all-errors gritar.
            # Conferido contra a instancia: o POST devolve o MESMO formato,
            # entao so o verbo muda.
            "${CURL[@]}" -X POST --retry 3 --retry-all-errors "$COOLIFY_URL/api/v1/deploy?uuid=$1" \
              | jq -r '.deployments[0].deployment_uuid // ""'
          }
          espera_deployment() {  # $1 deployment_uuid; fila 20min + execucao 10min
            # DOIS orcamentos, porque a fila do Coolify tem concurrent_builds=1
            # e apps de OUTROS projetos buildam na propria VPS (licity: 15-20min
            # por build) segurando o slot — visto 2x em 09/08: deployment do
            # pactha (que e so pull, ~15-50s) preso em 'queued' por >10min.
            # Desistir na fila e falso negativo; o teto de execucao segue curto.
            local st="" fila=120 execucao=60
            while :; do
              st=$("${CURL[@]}" "$COOLIFY_URL/api/v1/deployments/$1" | jq -r '.status // ""' 2>/dev/null)
              case "$st" in
                finished) return 0 ;;
                failed|cancelled*) echo "::error::deployment $1 terminou como '$st'"; return 1 ;;
                queued) fila=$((fila-1)); if [ "$fila" -le 0 ]; then break; fi ;;
                *) execucao=$((execucao-1)); if [ "$execucao" -le 0 ]; then break; fi ;;
              esac
              sleep 10
            done
            echo "::warning::deployment $1 nao concluiu (ultimo status='$st')"
            return 1
          }
          janela_ociosa() {  # $1 worker uuid; ate 15min; nunca bloqueia p/ sempre
            local TASKS tent rodando T st
            TASKS=$("${CURL[@]}" "$COOLIFY_URL/api/v1/applications/$1/scheduled-tasks" \
                    | jq -r --arg re "$CURTAS" '.[] | select(.name|test($re)|not) | .uuid')
            if [ -z "$TASKS" ]; then
              echo "::warning::worker $1: lista de tasks vazia/inacessivel — gate pulado"
              return 0
            fi
            for tent in $(seq 1 15); do
              rodando=0
              for T in $TASKS; do
                # So a execucao MAIS RECENTE conta: 'running' fantasma de execucao
                # orfa antiga nao pode emperrar o gate para sempre. E task SEM
                # NENHUMA execucao e OCIOSA, nao "possivelmente rodando" — task
                # recem-criada bloqueava o gate pelos 15min inteiros (visto no
                # 1o deploy: siconv-federal do trust, criada horas antes da 1a
                # rodada). Erro de curl/jq segue contando como ocupado (fail
                # closed de LEITURA, nao de ausencia de historico).
                corpo=$("${CURL[@]}" "$COOLIFY_URL/api/v1/applications/$1/scheduled-tasks/$T/executions")
                if [ $? -ne 0 ]; then
                  rodando=$((rodando+1))
                  continue
                fi
                st=$(printf '%s' "$corpo" | jq -r 'if length==0 then "sem-historico" else (sort_by(.created_at) | last | .status // "?") end' 2>/dev/null)
                case "$st" in
                  sem-historico|success|failed|cancelled*) : ;;
                  *) rodando=$((rodando+1)) ;;
                esac
              done
              if [ "$rodando" -eq 0 ]; then return 0; fi
              echo "worker $1: $rodando task(s) possivelmente em voo — aguardando ($tent/15)"
              sleep 60
            done
            echo "::warning::worker $1 nao ficou ocioso em 15min — deployando assim mesmo (upsert incremental + rodizio recuperam)"
            return 0
          }
          deploy_app() {  # $1 rotulo; $2 uuid; 0 = deployment confirmado
            local DEP
            if ! patch_tag "$2"; then
              echo "::error::$1: PATCH da tag falhou — app intocado"
              return 1
            fi
            DEP=$(disparar_deploy "$2")
            if [ -z "$DEP" ]; then
              echo "::error::$1: deploy nao disparou — revertendo tag para '${OLD_TAG:-?}'"
              rollback_tag "$2"
              return 1
            fi
            espera_deployment "$DEP"
          }

          for TRIO in $TENANTS; do
            NOME="${TRIO%%:*}"; RESTO="${TRIO#*:}"; API="${RESTO%%:*}"; WORKER="${RESTO#*:}"
            echo "=== tenant $NOME ==="
            if ! deploy_app "api-$NOME" "$API"; then
              echo "::warning::api-$NOME nao confirmou — worker-$NOME NAO sera deployado"
              FALHAS="$FALHAS api-$NOME(worker-pulado)"
              continue
            fi
            janela_ociosa "$WORKER"
            if ! deploy_app "worker-$NOME" "$WORKER"; then
              FALHAS="$FALHAS worker-$NOME"
            fi
          done

          {
            echo "### Deploy backend: $TAG"
            if [ -n "$FALHAS" ]; then
              echo "FALHARAM:$FALHAS — demais apps deployados; conferir no Coolify."
            else
              echo "APIs e workers dos 4 tenants deployados e CONFIRMADOS (deployment finished)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ -z "$FALHAS" ]
