name: build-backend

# Builda UMA vez as imagens do backend compartilhadas pelos 5 tenants
# (freitas/trust/montesiao/santamaria/novapalma) e publica no GitHub Container
# Registry (ghcr.io).
#
# POR QUE: a API e o worker sao IDENTICOS entre os 6 tenants -- a diferenca deles
# e so env de runtime. Antes, cada push na main fazia a VPS buildar as imagens
# (o worker sozinho tem 2,4 GB com Chromium), o que em 23/07 queimou os creditos
# de burst da instancia duas vezes. Buildando aqui UMA vez, a VPS deixa de fazer
# esse trabalho.
#
# ⚠️ A VPS NAO E MAIS AQUELA. O paragrafo acima citava "AWS Lightsail t3.large,
# 2 vCPU burstable"; desde o upgrade sao 8 vCPU e 32 GB (medido em 09/09/2026,
# ver INFRA.md §1). O motivo de buildar aqui continua de pe -- build fora do
# servidor de producao e melhor pratica, e o Coolify roda com concurrent_builds=1
# -- mas NAO invoque mais "creditos de burst" para justificar decisao nova.
#
# ESTADO ATUAL (Fase D, desde 09/08/2026): este workflow PUBLICA a imagem e o
# job `deploy` FECHA o ciclo — avanca a tag dos apps no Coolify e dispara o
# deploy na ordem certa (API primeiro, que roda as migrations no boot; worker
# depois). ⚠️ SEM ESPERAR JANELA DE COLETA desde 15/09/2026, por decisao do
# dono: o gate `janela_ociosa` segurava cada worker ate 15 min enquanto houvesse
# task em voo, e um deploy noturno levava mais de uma hora. O preco e aceito: a
# coleta que estiver rodando no worker e reiniciada no meio — os coletores
# commitam por municipio/plano e retomam na proxima rodada agendada. O auto-deploy por
# webhook do Coolify foi DESLIGADO nos apps pactha: ele recriava os containers
# com a TAG ANTIGA (churn inutil que registra commit novo rodando imagem velha
# na fila de deploy) e ja matou coleta no meio duas vezes em 08/08.
#
# Segredos exigidos no repo: COOLIFY_URL (ex.: http://54.232.208.118:8000) e
# COOLIFY_TOKEN (token de API com permissao write+deploy).
#
# Os FRONTENDS nao entram aqui: cada tenant embute build-args proprios
# (NEXT_PUBLIC_API_URL, logo, subtitulo) no bundle Next em build time, entao sao
# genuinamente diferentes -- ver build-frontend.yml (que tambem deploya).

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      # ⚠️ TESTE NAO VAI A PRODUCAO — e mexer neles custava um deploy inteiro.
      # Medido em 09/09/2026: os merges #448 e #449 tocaram SO `backend/tests/`
      # e cada um disparou 7 min de build + deploy dos 6 tenants (6 APIs e 6
      # workers). O custo nao e de CPU (a maquina tem 8 vCPU e folga) -- e de
      # TEMPO e de coleta reiniciada no meio, porque o Coolify serializa
      # deploy. A suite continua obrigatoria: o
      # `testes.yml` roda em TODO push e PR, sem filtro de path — o que se pula
      # aqui e so o rebuild da imagem, que nao executa pytest em lugar nenhum.
      # A negacao e posicional: um push que mexe em teste E em codigo casa pelo
      # `backend/**` e deploya normalmente.
      - '!backend/tests/**'
      - '.github/workflows/build-backend.yml'
  workflow_dispatch: {}   # permite rodar manualmente pelo painel do GitHub

# Concurrency NO JOB de build (nao no workflow): com cancel no nivel do
# workflow, um segundo push na main cancelava o RUN INTEIRO — inclusive um
# deploy em pleno voo, deixando tenants em estado parcial. Assim, build
# obsoleto e cancelado, mas deploy em andamento sempre termina.
env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/pactha

jobs:
  build:
    concurrency:
      group: build-backend-${{ github.ref }}-${{ matrix.name }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # publicar no ghcr da org
    strategy:
      fail-fast: false       # se a api falhar, ainda tenta o worker (e vice-versa)
      matrix:
        include:
          - name: api
            dockerfile: backend/Dockerfile.api
          - name: worker
            dockerfile: backend/Dockerfile.scraper
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # token efemero do proprio run

      # Tags: sha curto (imutavel, para pin exato) + latest (o que os apps seguem).
      - name: Metadados / tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .                       # contexto = RAIZ (os Dockerfiles fazem COPY backend/)
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache de layers no proprio ghcr: builds seguintes reaproveitam o
          # Chromium/pip e ficam MUITO mais rapidos (o custo do worker esta nessas
          # camadas, nao no codigo).
          cache-from: type=registry,ref=${{ env.IMAGE_BASE }}-${{ matrix.name }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_BASE }}-${{ matrix.name }}:buildcache,mode=max

      - name: Resumo
        run: |
          echo "### Imagem publicada: ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # Fase D: avanca a tag no Coolify e deploya em DUAS ONDAS: as APIs primeiro
  # (rodam as migrations no boot), com o deployment de cada uma CONFIRMADO via
  # GET /deployments/{uuid} (poll no status do app seria placebo: o container
  # velho segue 'running:healthy' enquanto o novo nem puxou imagem); depois os
  # workers dos tenants cuja API confirmou. API que nao subiu = worker daquele
  # tenant NAO e tocado (evita worker novo contra schema velho). Sem espera de
  # janela de coleta desde 15/09/2026. Segredos exigidos: COOLIFY_URL e
  # COOLIFY_TOKEN (sem eles o job falha alto no primeiro curl).
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120   # teto de seguranca; com as duas ondas e concurrent_builds>1 o normal e poucos minutos
    concurrency:
      group: deploy-backend        # serializa deploys; um novo ESPERA o atual
      cancel-in-progress: false
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      # trios nome:api_uuid:worker_uuid (instancia Coolify; PROVISIONAR_CLIENTE.md)
      TENANTS: >-
        freitas:givx3567ygxppum10p1oungn:s49c3b58lysqq0tpelneg3g3
        trust:pphvk2ygkuirjhu9qptvmfs5:xg714h8l7va4ejq70a5pmv5t
        montesiao:chr0n883hp19tjh7829k85a7:jhf0kjhps5keujiyhhsnvjt6
        santamaria:ufjctldngc14dsdw8pxnqivl:wquremniv57gag3tlil8uf6d
        novapalma:gemcwirmbelk1dztp2pbcqpf:kqcnvdsdkgn1efkm4nog8oes
        bgk:qhafp9uqmsvny75rzykmibdx:6xast9rw0wbzbownss9vamfq
    steps:
      - name: Deploy em duas ondas (APIs -> migrations confirmadas -> workers)
        run: |
          # POLITICA DE ERRO EXPLICITA. O shell default do Actions e `bash -e {0}`,
          # entao desligamos o -e e tratamos CADA comando: mutacao (PATCH/deploy)
          # falha ALTO com rollback de tag; leitura (polls) falha FECHADO
          # (erro de curl/jq conta como "ocupado"/"nao confirmado", nunca como ok).
          set +e
          set -uo pipefail
          TAG="sha-${GITHUB_SHA::7}"
          CURL=(curl -sS --connect-timeout 10 --max-time 30 -H "Authorization: Bearer $COOLIFY_TOKEN")
          FALHAS=""

          # ⭐ CREDENCIAL PRIMEIRO, E COM O MOTIVO NA TELA.
          #
          # Em 16/08/2026 o COOLIFY_TOKEN foi rotacionado e o secret do repo nao
          # acompanhou. Resultado: QUATRO merges seguidos (#220-#223) "passaram"
          # pelo build e nenhum chegou em producao — os quatro tenants ficaram
          # rodando codigo antigo por horas, e ninguem percebeu porque a unica
          # mensagem era:
          #
          #     api-freitas: deploy nao disparou — revertendo tag para '?'
          #
          # que descreve o SINTOMA e esconde a causa. Todas as chamadas voltavam
          # 401 `{"message":"Unauthenticated."}`, mas o `jq` apenas nao achava o
          # campo esperado e devolvia vazio — indistinguivel de "o Coolify
          # recusou o deploy". O proprio `'?'` no lugar da tag antiga ja era a
          # denuncia (o GET de leitura tambem tinha falhado), e passou batido.
          #
          # Uma requisicao antes do laco, olhando o STATUS HTTP e nao o corpo,
          # troca oito mensagens enganosas por uma frase acionavel.
          HTTP_AUTH=$("${CURL[@]}" -o /dev/null -w '%{http_code}' \
                      "$COOLIFY_URL/api/v1/applications" || echo "000")
          case "$HTTP_AUTH" in
            200) : ;;
            401|403)
              echo "::error::COOLIFY_TOKEN invalido ou revogado (HTTP $HTTP_AUTH). O token foi"
              echo "::error::rotacionado e o secret do repo nao. Gere um novo em Coolify ->"
              echo "::error::Keys & Tokens -> API tokens e atualize o secret COOLIFY_TOKEN."
              echo "::error::NADA foi deployado — as tags dos apps estao intocadas."
              exit 1 ;;
            000)
              echo "::error::Coolify inacessivel a partir do Actions (sem resposta em"
              echo "::error::$COOLIFY_URL). Servidor fora do ar ou COOLIFY_URL errado."
              exit 1 ;;
            *)
              echo "::error::Coolify respondeu HTTP $HTTP_AUTH ao listar aplicacoes —"
              echo "::error::abortando antes de mexer em tag de qualquer tenant."
              exit 1 ;;
          esac

          patch_tag() {  # $1 uuid; usa $TAG; exporta OLD_TAG p/ rollback
            OLD_TAG=$("${CURL[@]}" "$COOLIFY_URL/api/v1/applications/$1" | jq -r '.docker_registry_image_tag // ""')
            "${CURL[@]}" -X PATCH -H "Content-Type: application/json" \
              -d "{\"docker_registry_image_tag\":\"$TAG\"}" \
              "$COOLIFY_URL/api/v1/applications/$1" > /dev/null
          }
          rollback_tag() {  # $1 uuid; usa $OLD_TAG
            [ -n "$OLD_TAG" ] && "${CURL[@]}" -X PATCH -H "Content-Type: application/json" \
              -d "{\"docker_registry_image_tag\":\"$OLD_TAG\"}" \
              "$COOLIFY_URL/api/v1/applications/$1" > /dev/null
          }
          disparar_deploy() {  # $1 uuid -> stdout: deployment_uuid (vazio = falhou)
            # POST, e nao GET. O Coolify se atualizou sozinho para a v4.3.1 e o
            # disparo de deploy virou POST. O GET NAO sumiu — passou a responder
            # um aviso "isso precisa ser POST", com HTTP 200:
            #     Route::get ('/deploy', [OtherController::class, 'post_required'])
            #     Route::post('/deploy', [DeployController::class, 'deploy'])
            # Por isso a quebra foi SILENCIOSA: 200 com o corpo errado, o jq nao
            # achou `.deployments[0].deployment_uuid`, devolveu vazio, e o CI
            # concluiu (corretamente) "deploy nao disparou" e reverteu a tag nos
            # tres tenants. Um 404 teria feito o --retry-all-errors gritar.
            # Conferido contra a instancia: o POST devolve o MESMO formato,
            # entao so o verbo muda.
            "${CURL[@]}" -X POST --retry 3 --retry-all-errors "$COOLIFY_URL/api/v1/deploy?uuid=$1" \
              | jq -r '.deployments[0].deployment_uuid // ""'
          }
          espera_deployment() {  # $1 deployment_uuid; fila 20min + execucao 10min
            # DOIS orcamentos, porque a fila do Coolify tinha concurrent_builds=1
            # (subiu para 6 em 15/09/2026) e apps de OUTROS projetos buildam na
            # propria VPS (licity: 15-20min por build) segurando slot — visto 2x em 09/08: deployment do
            # pactha (que e so pull, ~15-50s) preso em 'queued' por >10min.
            # Desistir na fila e falso negativo.
            # ⚠️ O teto de execucao era 10min sob a premissa de que deploy de
            # backend e "so um pull". Com 5 tenants disputando o mesmo slot a
            # premissa envelheceu: em 17/08 um deploy de frontend levou 12min49
            # e o CI o reportou como falha 2min antes de ele terminar. O teto
            # acompanha, e o desfecho passa a distinguir os dois casos abaixo.
            local st="" fila=120 execucao=120
            while :; do
              st=$("${CURL[@]}" "$COOLIFY_URL/api/v1/deployments/$1" | jq -r '.status // ""' 2>/dev/null)
              case "$st" in
                finished) return 0 ;;
                failed|cancelled*) echo "::error::deployment $1 terminou como '$st'"; return 1 ;;
                queued) fila=$((fila-1)); if [ "$fila" -le 0 ]; then break; fi ;;
                *) execucao=$((execucao-1)); if [ "$execucao" -le 0 ]; then break; fi ;;
              esac
              sleep 10
            done
            # ⭐ ESTOURAR O RELOGIO NAO E O MESMO QUE FALHAR. Quem estourou ainda
            # 'in_progress' estava deployando e quase certamente terminou — vira
            # aviso, e o deploy do worker daquele tenant SEGUE (tratar como falha
            # pulava o worker de um tenant cuja API subiu, deixando os dois em
            # versoes diferentes). Quem estourou em 'queued' nunca comecou: esse
            # e falha de verdade, e ai pular o worker e o certo.
            if [ "$st" = "queued" ] || [ -z "$st" ]; then
              echo "::error::deployment $1 preso em '${st:-sem resposta}' — nao deployou"
              return 1
            fi
            echo "::warning::deployment $1 ainda '$st' apos a espera — provavelmente concluiu depois; conferir a tag no Coolify"
            return 0
          }
          dispara_app() {  # $1 rotulo; $2 uuid -> stdout: deployment_uuid; 1 = nao disparou
            # Mensagens vao para STDERR: quem chama captura o stdout como o id
            # do deployment, e um ::error:: ali viraria "id".
            local DEP
            if ! patch_tag "$2"; then
              echo "::error::$1: PATCH da tag falhou — app intocado" >&2
              return 1
            fi
            DEP=$(disparar_deploy "$2")
            if [ -z "$DEP" ]; then
              echo "::error::$1: deploy nao disparou — revertendo tag para '${OLD_TAG:-?}'" >&2
              rollback_tag "$2"
              return 1
            fi
            echo "$DEP"
          }

          # ⭐ DUAS ONDAS, e nao um tenant por vez (15/09/2026, decisao do dono:
          # "a maquina e boa, tira essas limitacoes"). Antes: API do tenant 1,
          # espera; worker do tenant 1 esperando janela sem coleta (ate 15 min);
          # API do tenant 2... — um deploy noturno passava de uma hora.
          #
          #   onda 1: as SEIS APIs disparadas juntas, depois espera cada uma
          #   onda 2: os workers dos tenants cuja API CONFIRMOU, juntos
          #
          # O que continua sendo regra (e correcao, nao limite de maquina): o
          # worker so sobe depois que a API do MESMO tenant confirmou — ela roda
          # as migrations no boot, e worker novo contra schema velho grava errado.
          # O paralelismo de verdade depende do `concurrent_builds` do servidor
          # no Coolify; com 1, as ondas so enfileiram (ainda sem a espera de
          # janela). Ver INFRA.md §4.
          declare -A DEP_API=() DEP_WK=()
          API_OK=" "
          echo "=== onda 1: APIs ==="
          for TRIO in $TENANTS; do
            NOME="${TRIO%%:*}"; RESTO="${TRIO#*:}"; API="${RESTO%%:*}"
            if DEP=$(dispara_app "api-$NOME" "$API"); then
              DEP_API[$NOME]="$DEP"; echo "api-$NOME: deployment $DEP"
            else
              FALHAS="$FALHAS api-$NOME(worker-pulado)"
            fi
          done
          for NOME in "${!DEP_API[@]}"; do
            if espera_deployment "${DEP_API[$NOME]}"; then
              API_OK="$API_OK$NOME "; echo "api-$NOME: confirmada"
            else
              echo "::warning::api-$NOME nao confirmou — worker-$NOME NAO sera deployado"
              FALHAS="$FALHAS api-$NOME(worker-pulado)"
            fi
          done
          # SEM esperar janela de coleta (ver o cabecalho): task em voo no worker
          # e reiniciada e retoma na proxima rodada agendada.
          echo "=== onda 2: workers ==="
          for TRIO in $TENANTS; do
            NOME="${TRIO%%:*}"; RESTO="${TRIO#*:}"; WORKER="${RESTO#*:}"
            case "$API_OK" in *" $NOME "*) ;; *) continue ;; esac
            if DEP=$(dispara_app "worker-$NOME" "$WORKER"); then
              DEP_WK[$NOME]="$DEP"; echo "worker-$NOME: deployment $DEP"
            else
              FALHAS="$FALHAS worker-$NOME"
            fi
          done
          for NOME in "${!DEP_WK[@]}"; do
            if espera_deployment "${DEP_WK[$NOME]}"; then
              echo "worker-$NOME: confirmado"
            else
              FALHAS="$FALHAS worker-$NOME"
            fi
          done

          {
            echo "### Deploy backend: $TAG"
            if [ -n "$FALHAS" ]; then
              echo "FALHARAM:$FALHAS — demais apps deployados; conferir no Coolify."
            else
              echo "APIs e workers dos 6 tenants deployados e CONFIRMADOS (deployment finished)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ -z "$FALHAS" ]
