; Configuracao do pytest do PACTHA.
;
; Existe para que `python -m pytest` NU, da raiz do repo, rode a suite inteira na
; configuracao certa — sem ninguem precisar lembrar de argumento nenhum. Antes
; deste arquivo o comando nu rodava so o que o cwd alcancava e numa configuracao
; que nao existe em producao (BI desligado), e o resultado eram tres testes
; vermelhos permanentes que o time aprendeu a ignorar.
;
; ⚠️ AS VARIAVEIS DE AMBIENTE NAO MORAM AQUI, e nao e por esquecimento: a chave
; `env` do ini so funciona com o plugin `pytest-env`, que nao esta instalado.
; Elas ficam em `backend/tests/conftest.py`, com `os.environ.setdefault` no topo
; do arquivo — carregado antes da coleta, que e o que importa, porque
; `database.py` chama `get_settings()` no IMPORT. Se um dia alguem instalar o
; plugin e quiser mover as envs para ca, mova as TRES juntas (DATABASE_URL,
; JWT_SECRET e BI_MODULE) e leia os comentarios de la antes.

[pytest]
testpaths = backend/tests
; A suite nao fala com banco nenhum (SQL se valida com `pglast`), entao nao ha
; fixture assincrona compartilhada: cada teste que precisa de loop chama
; `asyncio.run(...)` na propria funcao. Por isso nao existe pytest-asyncio aqui.
addopts = -q
; O ruido de terceiros nao pode competir com o aviso dos nossos testes. Silencia
; so o que e barulho de biblioteca; qualquer DeprecationWarning do PROPRIO codigo
; continua aparecendo.
filterwarnings =
    ignore::DeprecationWarning:pydantic._internal._config
    ignore:Using `httpx` with `starlette.testclient` is deprecated.*:
